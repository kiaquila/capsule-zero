# Capsule Zero production-shape stack — Phase 1.
#
# Phase 1 scope: just enough to serve the existing Next.js landing on
# https://capsulezero.app behind nginx + Let's Encrypt. Postgres, Kratos, the
# Go API, the worker, Spaces/imgproxy, and Grafana arrive in later PRs of
# `.specify/specs/024-production-stack-runtime/`.
#
# Operator runbook: docs_capsule_zero/project/devops/nginx-reverse-proxy.md
# The previous Supabase-based stack is preserved at
# `docker-compose.legacy-supabase.yml` until the legacy `/app` removal PR.

name: capsule-zero

networks:
  internal:
    driver: bridge

volumes:
  pgdata:

services:
  # PostgreSQL 16 — the v0.1 data tier (spec 024 Phase 2, auth slice).
  # Plain postgres: users/profiles/wardrobe are relational. pgvector is NOT
  # enabled here — it is deferred to the semantic catalog-search slice (US-012),
  # which is the first feature that actually needs vectors. The API connects
  # directly; PgBouncer is deferred by ADR-007. Init scripts in infra/postgres/
  # run once on an empty volume: they provision the Kratos role + database so the
  # Kratos container attaches to an already-prepared data tier. Published on
  # loopback only — nothing outside the droplet talks to Postgres directly.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-capsule_zero}
      # Consumed by infra/postgres/00-kratos-db.sh during first-time init.
      KRATOS_DB_USER: ${KRATOS_DB_USER:-kratos}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:?set KRATOS_DB_PASSWORD in the env file}
      KRATOS_DB_NAME: ${KRATOS_DB_NAME:-kratos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5432:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ory Kratos identity schema migration — one-shot, runs to completion then
  # exits. Idempotent: Kratos tracks applied migrations in its own database, so a
  # repeat run on an up-to-date schema is a no-op (negative scenario 6).
  kratos-migrate:
    image: oryd/kratos:v1.1.0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: ${KRATOS_DSN:?set KRATOS_DSN in the env file}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: migrate sql -e --yes
    networks: [internal]

  # Ory Kratos identity provider. Internal only — the Go API drives Kratos over
  # the private network via its API self-service flows; the browser never talks
  # to Kratos directly. `--dev` relaxes HTTPS assumptions for this internal,
  # non-internet-facing service (hardening tracked in spec-024 Known Issues).
  kratos:
    image: oryd/kratos:v1.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: ${KRATOS_DSN:?set KRATOS_DSN in the env file}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_CONNECTION_URI:-smtp://mailhog:1025/?disable_starttls=true}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_BASE_URL:-http://127.0.0.1:4433/}
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:-dev-only-kratos-cookie-secret-change-me-32}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:-dev0only0kratos0cipher0secret032}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: serve --config /etc/config/kratos/kratos.yml --dev --watch-courier
    expose:
      - "4433"
      - "4434"
    ports:
      - "${KRATOS_PUBLIC_HOST_BIND:-127.0.0.1}:4433:4433"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4433/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Retired as edge: a host (systemd) nginx now terminates TLS and reverse-proxies to the
  # web container published on 127.0.0.1:3000. See infra/nginx-host/ and
  # docs_capsule_zero/project/devops/dev-cd-pipeline.md. Kept (profile-gated) for rollback:
  #   docker compose --profile docker-edge up -d nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["docker-edge"]
    depends_on:
      web:
        condition: service_started
    ports:
      - "${NGINX_HOST_BIND:-0.0.0.0}:80:80"
      - "${NGINX_HOST_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_HOST_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT_HOST_DIR:-/var/www/certbot}:/var/www/certbot:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Next.js App Router landing (legacy `/app` until it moves to `/web`).
  # Built from app/Dockerfile (multi-stage Node, standalone output, `node server.js`).
  web:
    image: ${CAPSULE_WEB_IMAGE:-capsule-zero-web:local}
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_VERSION: ${NODE_VERSION:-22-bookworm-slim}
    init: true
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-https://capsulezero.app}
    expose:
      - "3000"
    # Published on loopback for the host (systemd) nginx edge.
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:3000:3000"
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/en').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
