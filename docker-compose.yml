# Capsule Zero production stack — scaffold.
#
# Implementation lands in `.specify/specs/024-production-stack-runtime/`.
# This file declares the target topology so reviewers can see every service
# explicitly. Service-specific Dockerfiles, configs under `infra/`, and the
# real env file are filled in by spec 024.
#
# The previous Supabase-based runtime lives at
# `docker-compose.legacy-supabase.yml` and stays in the repo until the
# implementation iteration that follows spec 024 removes both it and the
# legacy `/app` directory.
#
# `docker compose config` validates this YAML even though the build contexts
# below are placeholders. `docker compose up` is not expected to work until
# spec 024 ships.

name: capsule-zero

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kratos-data:
  traefik-letsencrypt:
  grafana-data:
  syslog:

services:
  # Edge: TLS via Let's Encrypt, rate-limit, forward-auth into Kratos.
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ops@capsulezero.app}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - ./infra/traefik:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, internal]

  # Identity provider (email/password Stage 1). Stage 2 adds OIDC providers.
  kratos:
    image: oryd/kratos:v1.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: ${KRATOS_DSN:-postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable}
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:-PLACEHOLDER_ROTATE_ME}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:-PLACEHOLDER_ROTATE_ME_32CHARSLONG}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_COURIER_SMTP_URI:-}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
      - kratos-data:/var/lib/kratos
    command:
      - "serve"
      - "all"
      - "--config=/etc/config/kratos/kratos.yml"
    networks: [internal]

  # App + Kratos database. pgvector enabled in init scripts.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capsule_zero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PLACEHOLDER_ROTATE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-capsule_zero}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-capsule_zero}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Connection pool in front of Postgres.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-capsule_zero}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-PLACEHOLDER_ROTATE_ME}
      DB_NAME: ${POSTGRES_DB:-capsule_zero}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    networks: [internal]

  # Cache, sessions, Redis-backed job queue.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Go modular monolith. Implementation in spec 024.
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      kratos:
        condition: service_started
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://capsule_zero:${POSTGRES_PASSWORD:-PLACEHOLDER_ROTATE_ME}@pgbouncer:5432/capsule_zero?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`${APP_HOST:-capsulezero.app}`) && PathPrefix(`/api/`)"
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.tls.certresolver: "letsencrypt"

  # Background job consumer (image jobs, embeddings, webhook fanout).
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://capsule_zero:${POSTGRES_PASSWORD:-PLACEHOLDER_ROTATE_ME}@pgbouncer:5432/capsule_zero?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks: [internal]

  # Next.js App Router web frontend. Implementation in spec 024.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: ./.env
        required: false
    environment:
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-https://capsulezero.app}
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_KRATOS_PUBLIC: ${KRATOS_PUBLIC_URL:-https://capsulezero.app/self-service}
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`${APP_HOST:-capsulezero.app}`)"
      traefik.http.routers.web.entrypoints: "websecure"
      traefik.http.routers.web.tls.certresolver: "letsencrypt"

  # On-the-fly image resize / WebP conversion for derived sizes.
  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${SPACES_ENDPOINT:-https://fra1.digitaloceanspaces.com}
      AWS_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY:-PLACEHOLDER}
      AWS_SECRET_ACCESS_KEY: ${SPACES_SECRET_KEY:-PLACEHOLDER}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
    networks: [internal]

  # Grafana dashboards. Reads syslog files and OTLP traces.
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-PLACEHOLDER_ROTATE_ME}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.capsulezero.app}
    volumes:
      - grafana-data:/var/lib/grafana
      - syslog:/var/log/host:ro
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`${GRAFANA_HOST:-grafana.capsulezero.app}`)"
      traefik.http.routers.grafana.entrypoints: "websecure"
      traefik.http.routers.grafana.tls.certresolver: "letsencrypt"
