# Capsule Zero production-shape stack.
#
# Runtime phases 1–2 provide host-nginx/web plus Postgres, Kratos, and the Go
# API; spec 040 adds the private Hetzner Object Storage dependency and upload
# foundation. Redis/imgproxy, backup automation, and deferred observability
# arrive in later slices of `.specify/specs/024-production-stack-runtime/`.
#
# Operator runbook: docs_capsule_zero/project/devops/nginx-reverse-proxy.md
# The previous Supabase-based stack is preserved at
# `docker-compose.legacy-supabase.yml` only for rollback while domains migrate.

name: capsule-zero

networks:
  internal:
    driver: bridge

volumes:
  pgdata:

services:
  # PostgreSQL 16 — the v0.1 data tier (spec 024 Phase 2, auth slice).
  # Plain postgres: users/profiles/wardrobe are relational. pgvector is NOT
  # enabled here — it is deferred to the semantic catalog-search slice (US-012),
  # which is the first feature that actually needs vectors. The API connects
  # directly; PgBouncer is deferred by ADR-007. Init scripts in infra/postgres/
  # run once on an empty volume: they provision the Kratos role + database so the
  # Kratos container attaches to an already-prepared data tier. Published on
  # loopback only — nothing outside the droplet talks to Postgres directly.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-capsule_zero}
      # Consumed by infra/postgres/00-kratos-db.sh during first-time init.
      KRATOS_DB_USER: ${KRATOS_DB_USER:-kratos}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:?set KRATOS_DB_PASSWORD in the env file}
      KRATOS_DB_NAME: ${KRATOS_DB_NAME:-kratos}
      # Optional least-privilege app role, provisioned only on first init of an
      # empty volume (spec 034); the populated prod volume was provisioned by
      # the one-time operator rollout instead. API_DATABASE_URL should use this
      # role, not the superuser above.
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5432:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ory Kratos identity schema migration — one-shot, runs to completion then
  # exits. Idempotent: Kratos tracks applied migrations in its own database, so a
  # repeat run on an up-to-date schema is a no-op (negative scenario 6).
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: ${KRATOS_DSN:?set KRATOS_DSN in the env file}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: migrate sql -e --yes
    networks: [internal]

  # Ory Kratos identity provider. The Go API drives Kratos over the private
  # internal network; every auth WRITE goes through the Go API (/api/auth/*),
  # which owns duplicate-identifier sanitization + the auth rate limit.
  # Recovery/verification run as code-method API flows (spec 035); the emailed
  # verification link lands on the app's /verify-email route (custom courier
  # template), so /self-service/* stays fully 404 at the edge. v1.3.1: native
  # code recovery needs the continue_with session hand-off (kratos.yml
  # feature_flags), which v1.1 did not support.
  kratos:
    image: oryd/kratos:v1.3.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: ${KRATOS_DSN:?set KRATOS_DSN in the env file}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_CONNECTION_URI:?set KRATOS_SMTP_CONNECTION_URI in the env file}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_BASE_URL:?set KRATOS_PUBLIC_BASE_URL in the env file}
      SECRETS_COOKIE_0: ${SECRETS_COOKIE_0:?set SECRETS_COOKIE_0 in the env file}
      SECRETS_CIPHER_0: ${SECRETS_CIPHER_0:?set SECRETS_CIPHER_0 in the env file}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en
      SELFSERVICE_ALLOWED_RETURN_URLS_0: ${APP_BASE_URL:?set APP_BASE_URL in the env file}
      # Index 1 would otherwise keep the kratos.yml dev entry
      # (https://capsulezero.local) in the production allowlist — env can
      # override list items but never shrink the list (security review 037).
      SELFSERVICE_ALLOWED_RETURN_URLS_1: ${APP_BASE_URL:?set APP_BASE_URL in the env file}
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/auth
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/profile
      # Recovery/verification run as code-method flows driven by the Go API
      # (spec 035); the UI URLs point at the app's flow-aware completion pages.
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/auth
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/verify-email
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/auth
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${APP_BASE_URL:?set APP_BASE_URL in the env file}/en/auth
      # Google sign-in (spec 037) — OFF unless the host env file provides the
      # provider JSON (client id/secret stay out of the repo; template in
      # deploy/compose.env.example, runbook google-oauth-setup.md).
      SELFSERVICE_METHODS_OIDC_ENABLED: ${KRATOS_OIDC_ENABLED:-false}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS: ${KRATOS_OIDC_PROVIDERS:-[]}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: serve --config /etc/config/kratos/kratos.yml --watch-courier
    expose:
      - "4433"
      - "4434"
    # Kratos public on host loopback: the host nginx edge proxies exactly one
    # path to it — the Google OIDC callback (spec 037). Same posture as
    # web:3000 / api:8080; everything else under /self-service/* stays 404.
    ports:
      - "${KRATOS_HOST_BIND:-127.0.0.1}:4433:4433"
    networks: [internal]
    healthcheck:
      test: ["CMD", "kratos", "remote", "status", "--endpoint", "http://127.0.0.1:4434", "--quiet"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 20s

  # Go modular monolith — auth/profile plus the spec-040 private object-storage
  # upload foundation. The browser reaches it only through nginx (/api/* ->
  # api). Published on loopback so the host (systemd) nginx edge can proxy to it.
  api:
    image: ${CAPSULE_API_IMAGE:-capsule-zero-api:local}
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION_API:-1.25.12}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL in the env file}
      KRATOS_PUBLIC_URL: ${KRATOS_INTERNAL_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_INTERNAL_ADMIN_URL:-http://kratos:4434}
      # Mirrors KRATOS_OIDC_ENABLED: gates /api/auth/google/* and the
      # provider-availability probe the web button reads (spec 037).
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      # Explicit allowlist: the API uses static, server-only credentials for
      # presigning and readiness. It never falls back to ambient AWS metadata.
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set OBJECT_STORAGE_ENDPOINT in the env file}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?set OBJECT_STORAGE_REGION in the env file}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID in the env file}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY in the env file}
      OBJECT_STORAGE_PRIVATE_BUCKET: ${OBJECT_STORAGE_PRIVATE_BUCKET:?set OBJECT_STORAGE_PRIVATE_BUCKET in the env file}
      # Keep unaffiliated direct-upload endpoints closed until owner quota,
      # orphan cleanup, and wardrobe attachment deliberately activate them.
      OBJECT_STORAGE_UPLOADS_ENABLED: ${OBJECT_STORAGE_UPLOADS_ENABLED:-false}
      # Provisioned policy boundaries for future catalog delivery; spec 040
      # does not activate public-catalog application behavior.
      OBJECT_STORAGE_PUBLIC_BUCKET: ${OBJECT_STORAGE_PUBLIC_BUCKET:-capsulezero-prod-public-catalog}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-https://capsulezero-prod-public-catalog.hel1.your-objectstorage.com}
    expose:
      - "8080"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:8080:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Retired as edge: a host (systemd) nginx now terminates TLS and reverse-proxies to the
  # web container published on 127.0.0.1:3000. See infra/nginx-host/ and
  # docs_capsule_zero/project/devops/prod-cd-pipeline.md. Kept (profile-gated) for rollback:
  #   docker compose --profile docker-edge up -d nginx
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    profiles: ["docker-edge"]
    depends_on:
      web:
        condition: service_started
    ports:
      - "${NGINX_HOST_BIND:-0.0.0.0}:80:80"
      - "${NGINX_HOST_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_HOST_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT_HOST_DIR:-/var/www/certbot}:/var/www/certbot:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Next.js App Router landing (`/app` is the canonical web frontend).
  # Built from app/Dockerfile (multi-stage Node, standalone output, `node server.js`).
  web:
    image: ${CAPSULE_WEB_IMAGE:-capsule-zero-web:local}
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_VERSION: ${NODE_VERSION:-22-bookworm-slim}
    init: true
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-https://capsulezero.app}
      # Talk to the Go API (server-side) over the private network.
      CAPSULE_PROVIDER_MODE: ${CAPSULE_PROVIDER_MODE:-api}
      CAPSULE_API_BASE_URL: ${CAPSULE_API_BASE_URL:-http://api:8080}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?set SESSION_SIGNING_SECRET in the env file}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    # Published on loopback for the host (systemd) nginx edge.
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:3000:3000"
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000/en'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
