name: AI Review Wake-up

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-review-wakeup-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  wake-up:
    if: >
      github.event.issue.pull_request &&
      ((contains(github.event.comment.body, '@codex review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
          contains(github.event.comment.body, 'Codex Review:')))
    name: AI Review wake-up
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-pr-context.mjs

      - name: Restart PR-linked AI Review when needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node scripts/restart-ai-review.mjs
