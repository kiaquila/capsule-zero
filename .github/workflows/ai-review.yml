name: AI Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 10 --model claude-sonnet-4-6"
          prompt: |
            Review this pull request following the project standards defined in CLAUDE.md.

            Check for:
            - Code correctness, TypeScript types, React patterns (Next.js 14+ App Router)
            - Design system compliance: glassmorphism tokens, 8px grid, achromatic palette (no hardcoded colors)
            - i18n completeness: all UI strings must exist in EN, ES-AR, and RU
            - Accessibility: semantic HTML, ARIA labels, keyboard navigation, Lighthouse 95+
            - Performance: no blocking imports, images optimized, page load < 2s on 4G
            - Security: no XSS, no secrets in code, safe data handling (OWASP Top 10)

            Verdict rules:
            - Use "approve" if no issues found
            - Use "comment" if findings are advisory only (low severity)
            - Use "request_changes" only for blocking issues (incorrect logic, broken types, missing i18n keys, security vulnerabilities)

            Post your findings as a single review comment on the PR.
            Start the comment with the HTML tag: <!-- ai-review -->
