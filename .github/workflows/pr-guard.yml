name: PR Guard

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
      head_ref:
        description: PR head branch name
        required: true
        type: string
      base_ref:
        description: PR base branch name
        required: true
        type: string

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted gate logic from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve PR base and head SHAs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF_NAME: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE_REF_NAME"
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}/head"
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            git fetch --no-tags origin "$INPUT_BASE_REF"
            git fetch --no-tags origin "$INPUT_HEAD_REF"
            base_sha="$(git rev-parse "origin/$INPUT_BASE_REF")"
            head_sha="$(git rev-parse "origin/$INPUT_HEAD_REF")"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check context coverage for code changes
        shell: bash
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail

          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed_files="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          echo "$changed_files"

          code_changed=0
          context_changed=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              app/*|scripts/*)
                code_changed=1
                ;;
              docs_capsule_zero/*|.specify/*|html-prototypes/*|AGENTS.md|CLAUDE.md|.github/*)
                context_changed=1
                ;;
            esac
          done <<< "$changed_files"

          if [ "$code_changed" -eq 1 ] && [ "$context_changed" -ne 1 ]; then
            echo "Code changed without any durable docs, agent-context, or workflow update."
            echo "Update docs_capsule_zero/, AGENTS.md, CLAUDE.md, or .github/ when scope, behavior, architecture, or delivery process changes."
            exit 1
          fi

      - name: Require baseline documentation
        shell: bash
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail

          head_tree="$(git ls-tree -r --name-only "$HEAD_SHA")"

          require_path() {
            if ! grep -Fxq "$1" <<< "$head_tree"; then
              echo "Missing required path in PR head: $1"
              exit 1
            fi
          }

          require_dir() {
            if ! grep -E "^$1/" <<< "$head_tree" > /dev/null; then
              echo "Missing required directory in PR head: $1"
              exit 1
            fi
          }

          require_path AGENTS.md
          require_path CLAUDE.md
          require_path docs_capsule_zero/project/frontend/frontend-docs.md
          require_path docs_capsule_zero/project/backend/backend-docs.md
          require_path docs_capsule_zero/project/devops/ai-pr-workflow.md
          require_path docs_capsule_zero/project/devops/ai-orchestration-protocol.md
          require_path docs_capsule_zero/project/devops/ai-runner.md
          require_path docs_capsule_zero/project/devops/review-contract.md
          require_path docs_capsule_zero/project/devops/codex-github-setup.md
          require_path docs_capsule_zero/project/devops/validation-matrix.md
          require_path docs_capsule_zero/adr/adr-004-ai-development-workflow.md
          require_path docs_capsule_zero/adr/adr-005-local-worker-orchestration.md
          require_dir app
