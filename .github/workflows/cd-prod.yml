name: CD Prod

# Auto-deploy to production (https://capsulezero.app) on merge to main.
#
# Build-in-CI, pull-on-server: GitHub Actions builds and pushes the web + api images to
# GHCR; the server only pulls the SHA-pinned images and rolls the `capsule-zero` compose
# project (postgres + kratos + api + web behind the host nginx edge). Merges that touch
# only docs/tests/specs do NOT deploy.
#
# There is no separate dev environment: dev.capsulezero.app was decommissioned with the
# 2026-07-02 Hetzner migration; every merge to main lands on production directly.
#
# Spec: .specify/specs/033-prod-cd-activation/
# Runbook (operator setup): docs_capsule_zero/project/devops/prod-cd-pipeline.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Existing image tag to redeploy without rebuilding (e.g. sha-<40hex>). Leave blank to build HEAD."
        required: false
        default: ""

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_WEB: ghcr.io/kiaquila/capsule-zero-web
  IMAGE_API: ghcr.io/kiaquila/capsule-zero-api

jobs:
  gate:
    name: detect-deploy-relevant-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch -> deploy"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zero="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ] \
             || ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            echo "no usable 'before' SHA -> deploy to be safe"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files in ${BEFORE}..${AFTER}:"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$changed"

          deploy_path_pattern='^(app/|api/|worker/|infra/|docker-compose\.yml$|package-lock\.json$|app/package-lock\.json$|\.github/workflows/cd-prod\.yml$)'
          if grep -E "$deploy_path_pattern" <<< "$changed" >/dev/null; then
            echo "deploy-relevant paths changed -> deploy"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "only non-deploy paths changed -> skip deploy"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build-and-push
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.image_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_web: ${{ steps.meta.outputs.image_web }}
      image_api: ${{ steps.meta.outputs.image_api }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image refs
        id: meta
        run: |
          {
            echo "image_web=${IMAGE_WEB}:sha-${GITHUB_SHA}"
            echo "image_api=${IMAGE_API}:sha-${GITHUB_SHA}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Buildx (container driver for registry cache)
        run: docker buildx create --use --name czbuilder --driver docker-container

      - name: Build and push web image
        run: |
          set -euo pipefail
          docker buildx build \
            --target runner \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --tag "${IMAGE_WEB}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_WEB}:prod" \
            --cache-from "type=registry,ref=${IMAGE_WEB}:buildcache" \
            --cache-to   "type=registry,ref=${IMAGE_WEB}:buildcache,mode=max" \
            --push \
            ./app

      - name: Build and push api image
        env:
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=${BUILD_TIME}" \
            --tag "${IMAGE_API}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_API}:prod" \
            --cache-from "type=registry,ref=${IMAGE_API}:buildcache" \
            --cache-to   "type=registry,ref=${IMAGE_API}:buildcache,mode=max" \
            --push \
            ./api

  deploy:
    name: deploy-to-prod-server
    needs: [gate, build]
    # Run when gated true and build either succeeded (push / build-HEAD dispatch)
    # or was skipped (workflow_dispatch redeploy of an existing image_sha).
    if: >-
      always() &&
      needs.gate.outputs.run == 'true' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      id-token: write
    outputs:
      deploy_sha: ${{ steps.ref.outputs.deploy_sha }}
    # Records a GitHub Deployment for this commit under the `production`
    # environment, so the repo's Environments widget and the Deployments page
    # show what is live. The deployment is only marked successful if this whole
    # job succeeds — and the "Verify live release" step below fails the job on a
    # SHA mismatch, so a green/active deployment means prod was verified against
    # the running /api/health, not merely that `compose up` returned 0.
    # Caveat: this implicit deployment is always bound to the workflow run's own
    # github.sha. That is correct for merge deploys, but wrong for a
    # workflow_dispatch rollback (deploy_sha = the older image's commit) — the
    # record-rollback-release job below re-binds the environment to the
    # verified rollback SHA after this job succeeds.
    environment:
      name: production
      url: https://capsulezero.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve image refs
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_IMAGE_SHA: ${{ github.event.inputs.image_sha }}
          BUILT_IMAGE_WEB: ${{ needs.build.outputs.image_web }}
          BUILT_IMAGE_API: ${{ needs.build.outputs.image_api }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${ROLLBACK_IMAGE_SHA:-}" ]; then
            if [[ ! "$ROLLBACK_IMAGE_SHA" =~ ^sha-[0-9a-f]{40}$ ]]; then
              echo "::error::image_sha must match sha-<40 lowercase hex characters>"
              exit 1
            fi
            deploy_sha="${ROLLBACK_IMAGE_SHA#sha-}"
            git fetch --no-tags origin main
            bash scripts/check-kratos-rollback-boundary.sh origin/main "$deploy_sha"
            {
              echo "image_web=${IMAGE_WEB}:${ROLLBACK_IMAGE_SHA}"
              echo "image_api=${IMAGE_API}:${ROLLBACK_IMAGE_SHA}"
              echo "deploy_sha=${deploy_sha}"
              echo "sync_host_nginx=false"
            } >> "$GITHUB_OUTPUT"
          else
            if [ -z "${BUILT_IMAGE_WEB:-}" ] || [ -z "${BUILT_IMAGE_API:-}" ]; then
              echo "::error::build job did not produce image refs"
              exit 1
            fi
            if [[ ! "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::current SHA must be a 40-character lowercase hex commit"
              exit 1
            fi
            {
              echo "image_web=${BUILT_IMAGE_WEB}"
              echo "image_api=${BUILT_IMAGE_API}"
              echo "deploy_sha=${CURRENT_SHA}"
              echo "sync_host_nginx=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Connect deploy runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: 1.98.9
          ping: ${{ secrets.PROD_DEPLOY_HOST }}

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.PROD_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
          IMAGE_WEB_REF: ${{ steps.ref.outputs.image_web }}
          IMAGE_API_REF: ${{ steps.ref.outputs.image_api }}
          DEPLOY_SHA: ${{ steps.ref.outputs.deploy_sha }}
          SYNC_HOST_NGINX: ${{ steps.ref.outputs.sync_host_nginx }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_WEB_REF" =~ ^ghcr\.io/kiaquila/capsule-zero-web:sha-[0-9a-f]{40}$ ]]; then
            echo "::error::resolved web image ref is not an expected immutable tag"
            exit 1
          fi
          if [[ ! "$IMAGE_API_REF" =~ ^ghcr\.io/kiaquila/capsule-zero-api:sha-[0-9a-f]{40}$ ]]; then
            echo "::error::resolved api image ref is not an expected immutable tag"
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy SHA must be a 40-character lowercase hex commit"
            exit 1
          fi
          if [[ ! "$SYNC_HOST_NGINX" =~ ^(true|false)$ ]]; then
            echo "::error::sync_host_nginx must be true or false"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            sudo /usr/local/sbin/capsule-zero-deploy "$IMAGE_WEB_REF" "$IMAGE_API_REF" "$DEPLOY_SHA" "$SYNC_HOST_NGINX"

      - name: Verify live release matches deployed SHA
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.deploy_sha }}
          IS_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_sha != '' }}
        # Read the running commit back from the public edge and confirm prod is
        # actually serving the SHA we just shipped. A concrete different commit
        # is a hard failure (the deploy did not really take). The "unknown"
        # tolerance (image predates build-info) applies only on an explicit
        # workflow_dispatch rollback — a freshly built merge/build-HEAD deploy
        # reporting "unknown" means the ldflags SHA injection is broken and
        # hard-fails. The tolerance also requires a successfully parsed JSON
        # health response — if the edge never returns readable health JSON
        # (transport error, timeout, nginx error page), the job fails rather
        # than reporting an unverified deploy as green. curl runs without -f on
        # purpose: a degraded 503 still carries build info, and healthiness
        # itself is owned by the deploy wrapper's smoke check — this step only
        # asserts release identity.
        run: |
          set -euo pipefail
          url="https://capsulezero.app/api/health"
          live=""            # commit from the most recent parsed health response
          got_health=false   # true once any attempt returned parseable health JSON
          for attempt in $(seq 1 10); do
            if body="$(curl -sS --max-time 10 "$url")" \
              && parsed="$(printf '%s' "$body" | jq -er '.commit // "unknown"' 2>/dev/null)"; then
              got_health=true
              live="$parsed"
            fi
            echo "attempt ${attempt}: live commit=${live:-<none>} want=${DEPLOY_SHA}"
            if [ "$live" = "$DEPLOY_SHA" ]; then
              echo "verified: prod is serving ${DEPLOY_SHA}"
              exit 0
            fi
            sleep 6
          done

          if [ "$got_health" != "true" ]; then
            echo "::error::could not read health JSON from ${url} after 10 attempts — deployment not verified"
            exit 1
          fi
          if [ "$live" = "unknown" ]; then
            if [ "$IS_ROLLBACK" = "true" ]; then
              echo "::warning::/api/health reports no build info (pre-036 rollback image) — cannot assert the SHA; the deploy wrapper's health smoke already passed"
              exit 0
            fi
            echo "::error::freshly built image reports no build info — ldflags SHA injection is broken; deployment not verified"
            exit 1
          fi
          echo "::error::prod is serving commit ${live}, expected ${DEPLOY_SHA} — deployment not verified"
          exit 1

      - name: Inactivate superseded production deployments
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub's auto-inactivation on a success status skips production
        # environments, so prior Active records would accumulate as merges
        # land. After the release is verified, post `inactive` to every
        # deployment whose latest status is success — they are all superseded
        # by this run. The run's own implicit deployment is still in_progress
        # here, so it is untouched and becomes the single Active record when
        # the job completes. (On a rollback dispatch the implicit record
        # carries the wrong SHA; record-rollback-release below replaces it.)
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=100" --jq '.[].id' \
            | while read -r dep_id; do
                dep_state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}/statuses?per_page=1" --jq '.[0].state // "none"')"
                if [ "$dep_state" = "success" ]; then
                  jq -n '{state: "inactive"}' \
                    | gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}/statuses" --input - --jq '.state' >/dev/null
                  echo "inactivated superseded production deployment ${dep_id}"
                fi
              done

  # A workflow_dispatch rollback deploys an older commit than the run's own
  # github.sha, but the deploy job's implicit `environment: production`
  # deployment is always recorded against github.sha — exactly during a
  # rollback the Environments page would mark the wrong commit Active. This job
  # runs only after a successful (already health-verified) rollback deploy,
  # creates an explicit Deployment + success status bound to the rolled-back
  # SHA via the REST API, and then explicitly marks every other production
  # deployment inactive — GitHub's auto-inactivation on a success status skips
  # production environments, so without this the implicit github.sha-bound
  # record could stay active alongside the rollback record. Merge deploys
  # never reach this job: their implicit deployment is already correct.
  record-rollback-release:
    name: record-rollback-release
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.image_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Bind production deployment to the rolled-back SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy job did not expose a valid deploy_sha (got '${DEPLOY_SHA:-<empty>}')"
            exit 1
          fi
          deployment_id="$(jq -n \
            --arg ref "$DEPLOY_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{
              ref: $ref,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
              description: ("rollback: verified live release (run " + $run + ")")
            }' | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')"
          if [ -z "$deployment_id" ]; then
            echo "::error::could not create a deployment for ${DEPLOY_SHA}"
            exit 1
          fi
          jq -n \
            --arg url "https://capsulezero.app" \
            --arg log "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: "success", environment_url: $url, log_url: $log}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --input - --jq '.state'

          # A success status auto-inactivates only non-transient, NON-production
          # prior deployments (GitHub REST semantics), so the implicit
          # github.sha-bound deployment from the deploy job would stay active.
          # Explicitly inactivate every other still-active production
          # deployment so exactly one active record — the rollback SHA — is left.
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=100" --jq '.[].id' \
            | while read -r other_id; do
                [ "$other_id" = "$deployment_id" ] && continue
                other_state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${other_id}/statuses?per_page=1" --jq '.[0].state // "none"')"
                case "$other_state" in
                  success|in_progress|queued|pending)
                    jq -n '{state: "inactive"}' \
                      | gh api "repos/${GITHUB_REPOSITORY}/deployments/${other_id}/statuses" --input - --jq '.state' >/dev/null
                    echo "inactivated production deployment ${other_id} (was ${other_state})"
                    ;;
                esac
              done
          echo "production deployment ${deployment_id} now points at ${DEPLOY_SHA}"
