name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: ""
        type: string

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f CLAUDE.md
          test -d docs_capsule_zero
          test -d docs_capsule_zero/adr
          test -d docs_capsule_zero/project
          test -f docs_capsule_zero/project/frontend/frontend-docs.md
          test -f docs_capsule_zero/project/backend/backend-docs.md
          test -f docs_capsule_zero/project/devops/ai-pr-workflow.md
          test -f docs_capsule_zero/project/devops/ai-orchestration-protocol.md
          test -f docs_capsule_zero/project/devops/ai-runner.md
          test -f docs_capsule_zero/project/devops/review-contract.md
          test -f docs_capsule_zero/project/devops/codex-github-setup.md
          test -f docs_capsule_zero/project/devops/validation-matrix.md
          test -d .github/workflows
          test -d app
          test -f app/package.json

  app-checks:
    name: app-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build
