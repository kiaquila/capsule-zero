name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Run repository baseline
        run: npm run check:repo

      - name: Run API contract checks
        run: npm run check:api-contract

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Build Docker image
        run: docker build --target runner -t capsule-zero-web:ci ./app

      - name: Run tests if present
        run: npm test
