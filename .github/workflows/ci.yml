name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Run gate script tests
        run: node --test scripts/lib/*.test.mjs

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Run repository baseline
        run: npm run check:repo

      - name: Validate rollback nginx container
        run: npm run check:nginx-container

      - name: Validate Kratos migration and auth flow
        run: npm run check:kratos-container

      - name: Run API contract checks
        run: npm run check:api-contract

      - name: Run lint
        run: npm run lint

      - name: Run CSS lint
        run: npm run lint:css

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Build Docker image
        run: docker build --target runner -t capsule-zero-web:ci ./app

      - name: Run tests if present
        run: npm test
