name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    # Pin the WebKit test platform; install matching browsers and native libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      guest-postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: guest-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the exact api/go.mod toolchain without a container registry pull.
      - name: Setup Go
        id: go
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Go vet + test (api)
        working-directory: api
        env:
          GOTOOLCHAIN: local
          TEST_DATABASE_URL: postgres://postgres:guest-ci-only@localhost:5432/postgres?sslmode=disable
          GO_SETUP_OUTCOME: ${{ steps.go.outcome }}
        run: |
          if [[ "$GO_SETUP_OUTCOME" == "success" ]]; then
            go vet ./...
            go test ./...
            go test -race -tags=integration ./internal/guest -count=1
          else
            docker run --rm --network host -e GOTOOLCHAIN=local -e TEST_DATABASE_URL -v "$PWD:/src" -w /src public.ecr.aws/docker/library/golang:1.26.6-bookworm \
              sh -c 'go vet ./... && go test ./... && go test -race -tags=integration ./internal/guest -count=1'
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            tests/e2e/package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Install e2e dependencies
        run: npm ci --prefix tests/e2e

      - name: Lint e2e suite
        run: npm run lint:e2e

      - name: Typecheck e2e suite
        run: npm run typecheck:e2e

      # Browser binaries vary with the Linux distribution. An OS-only cache
      # restored Ubuntu 24 WebKit on Ubuntu 26, which lacks ICU 74.
      - name: Install Playwright browsers and system deps
        run: npx --prefix tests/e2e playwright install --with-deps chromium webkit

      - name: Seed app env from example (CI stub credentials)
        run: cp app/.env.local.example app/.env.local

      - name: Build /app
        run: npm --prefix app run build

      - name: Run Playwright e2e suite
        env:
          CI: "true"
          # Activate the standalone origin guard (spec 037): a dedicated project
          # + webServer that rebuilds /app as the production standalone server
          # (node server.js, HOSTNAME=0.0.0.0) with a canary NEXT_PUBLIC_APP_URL,
          # then asserts the Google callback redirects to the configured origin
          # and never the 0.0.0.0 bind. Off by default so local `npm test` skips
          # the extra standalone build; required here so a revert of the callback
          # route to request.nextUrl.origin fails the `test` gate red.
          E2E_ORIGIN_GUARD: "1"
        run: npm --prefix tests/e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
