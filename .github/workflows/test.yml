name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the exact api/go.mod toolchain without a container registry pull.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Go vet + test (api)
        working-directory: api
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test ./...

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            tests/e2e/package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Install e2e dependencies
        run: npm ci --prefix tests/e2e

      - name: Lint e2e suite
        run: npm run lint:e2e

      - name: Typecheck e2e suite
        run: npm run typecheck:e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix tests/e2e playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --prefix tests/e2e playwright install-deps chromium webkit

      - name: Seed app env from example (CI stub credentials)
        run: cp app/.env.local.example app/.env.local

      - name: Build /app
        run: npm --prefix app run build

      - name: Run Playwright e2e suite
        env:
          CI: "true"
          # Activate the standalone origin guard (spec 037): a dedicated project
          # + webServer that rebuilds /app as the production standalone server
          # (node server.js, HOSTNAME=0.0.0.0) with a canary NEXT_PUBLIC_APP_URL,
          # then asserts the Google callback redirects to the configured origin
          # and never the 0.0.0.0 bind. Off by default so local `npm test` skips
          # the extra standalone build; required here so a revert of the callback
          # route to request.nextUrl.origin fails the `test` gate red.
          E2E_ORIGIN_GUARD: "1"
        run: npm --prefix tests/e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
