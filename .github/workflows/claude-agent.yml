name: Claude Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-agent-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  claude:
    if: >
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review once') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (vars.AI_IMPLEMENTATION_AGENT == '' || vars.AI_IMPLEMENTATION_AGENT == 'claude')
    name: Claude Agent
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Bootstrap checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-pr-context.mjs

      - name: Resolve Claude agent safety
        id: safety
        shell: bash
        run: |
          set -euo pipefail

          claude_agent_permitted="true"
          block_reason=""

          if [ "${{ steps.pr.outputs.is_pull_request }}" = "true" ] && [ "${{ steps.pr.outputs.is_fork }}" = "true" ]; then
            claude_agent_permitted="false"
            block_reason="Claude implementation is disabled for fork PRs because this issue_comment workflow runs with repository secrets."
          fi

          echo "claude_agent_permitted=$claude_agent_permitted" >> "$GITHUB_OUTPUT"
          echo "block_reason=$block_reason" >> "$GITHUB_OUTPUT"

      - name: Explain unavailable Claude agent path
        if: steps.safety.outputs.claude_agent_permitted != 'true' && steps.pr.outputs.is_pull_request == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              "Claude implementation could not run for the selected PR context.",
              "",
              `Reason: ${process.env.BLOCK_REASON}`,
              "",
              "This repository keeps comment-driven Claude automation fail-closed for fork PRs.",
              "Use Codex for this PR, or move the change onto a trusted repository-owned branch before invoking `@claude`.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: message,
            });
        env:
          BLOCK_REASON: ${{ steps.safety.outputs.block_reason }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}

      - name: Fail unavailable Claude agent path
        if: steps.safety.outputs.claude_agent_permitted != 'true'
        shell: bash
        run: |
          echo "${{ steps.safety.outputs.block_reason }}"
          exit 1

      - name: Checkout PR head
        if: steps.pr.outputs.is_pull_request == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.checkout_ref }}

      - name: Checkout default branch
        if: steps.pr.outputs.is_pull_request != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude implementation agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Act as the selected implementation agent for this repository.

            Follow repository guidance from `CLAUDE.md`, `AGENTS.md`, `docs_capsule_zero/project/devops/ai-pr-workflow.md`, and `docs_capsule_zero/project/devops/ai-orchestration-protocol.md`.

            Treat the triggering GitHub comment as the scoped assignment. Stay within one branch and one pull request for that task.

            If this command was posted on pull request #${{ steps.pr.outputs.pr_number }}, work against head commit `${{ steps.pr.outputs.head_sha }}` and keep all changes on that PR branch.

            Update durable docs and workflow artifacts when the change affects architecture, process, or behavior.

            Do not perform pull-request review in this workflow unless the user explicitly asks for review instead of implementation.
          claude_args: |
            --max-turns 20
            --model claude-opus-4-6
