# Capsule Zero local dev override.
#
# Usage: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
#
# Differences from production:
#   - Kratos courier points at MailHog instead of Resend SMTP.
#   - MailHog UI bound to 127.0.0.1:8025 so the developer can inspect emails.
#   - `api` and `worker` mount their source for hot-reload; loggers run at debug.
#   - Traefik exposes the dashboard on 127.0.0.1:8081 for debugging.
#
# Implementation in spec 024-production-stack-runtime.

services:
  traefik:
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:8081:8080"

  kratos:
    environment:
      COURIER_SMTP_CONNECTION_URI: "smtp://mailhog:1025/?disable_starttls=true&skip_ssl_verify=true"
      LOG_LEVEL: debug

  api:
    volumes:
      - ./api:/src:ro
    environment:
      LOG_LEVEL: debug
      OTEL_LOG_LEVEL: debug

  worker:
    volumes:
      - ./worker:/src:ro
    environment:
      LOG_LEVEL: debug

  web:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_DEBUG: "1"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]
