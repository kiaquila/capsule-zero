# Capsule Zero local dev override.
#
# Runs the production-shape compose stack on the laptop with an mkcert-issued
# TLS certificate for `capsulezero.local` in place of the host-mounted Let's
# Encrypt cert for `capsulezero.app`. The `nginx` and `web` images are
# byte-for-byte identical to prod — only the bind-mounted vhost, the cert
# directory, and the web app's public URL differ.
#
# First-time setup:
#   1. Install mkcert (`brew install mkcert nss` on macOS).
#   2. `node scripts/local-certs.mjs` — installs the mkcert root CA into the
#      system trust store and writes `infra/dev-certs/{cert,key}.pem`.
#   3. Add `127.0.0.1 capsulezero.local` to `/etc/hosts`.
#
# Daily use (the --env-file supplies dev credentials; the base file fails fast on
# missing production secrets, which an override default cannot rescue):
#   docker compose --env-file deploy/compose.dev.env \
#     -f docker-compose.yml -f docker-compose.dev.yml up --build
#   open https://capsulezero.local
#
# The `!override` tag replaces the nginx `volumes` list rather than appending
# to it (compose's default for list fields). Without it we would end up with
# two bind mounts on `/etc/nginx/conf.d`, which Docker rejects.

services:
  nginx:
    # Local dev keeps the documented default command working even though the
    # base file profile-gates the in-container nginx for production rollback.
    profiles: !override []
    volumes: !override
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d.dev:/etc/nginx/conf.d:ro
      - ./infra/dev-certs:/etc/nginx/certs:ro

  api:
    environment:
      # Everything behind the dev edge shares one client address, so manual
      # testing plus the e2e suites would exhaust the prod-strict 10/min auth
      # bucket in a single run (spec 035). Production keeps the default.
      API_AUTH_RATE_PER_MINUTE: "120"
      API_AUTH_RATE_BURST: "60"

  web:
    environment:
      NEXT_PUBLIC_APP_URL: https://capsulezero.local

  kratos:
    command: serve --config /etc/config/kratos/kratos.yml --dev --watch-courier
    # Local dev binds Kratos public to loopback so developers can inspect flows
    # directly. Production also publishes 4433 on loopback (spec 035) — the host
    # edge proxies the single emailed verification-link path to it.
    ports:
      - "127.0.0.1:4433:4433"
    environment:
      COURIER_SMTP_CONNECTION_URI: smtp://mailhog:1025/?disable_starttls=true
      # Emailed verification links carry this base; pointing it at the dev edge
      # makes link clicks traverse nginx exactly like prod (spec 035). The
      # 127.0.0.1:4433 bind below remains for direct flow inspection.
      SERVE_PUBLIC_BASE_URL: https://capsulezero.local/
      # Local-only Argon2 relaxation: production hashes with iterations: 2
      # (kratos.yml, OWASP t>=2); dev keeps 1 so full-stack e2e sign-up stays
      # inside its measured timings (spec 024 dead-end 2026-06-30, spec 034).
      HASHERS_ARGON2_ITERATIONS: "1"
      SECRETS_COOKIE_0: ${SECRETS_COOKIE_0:-dev-only-kratos-cookie-secret-change-me-32}
      SECRETS_CIPHER_0: ${SECRETS_CIPHER_0:-dev0only0kratos0cipher0secret032}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://capsulezero.local/en
      SELFSERVICE_ALLOWED_RETURN_URLS_0: https://capsulezero.local
      SELFSERVICE_ALLOWED_RETURN_URLS_1: http://127.0.0.1:3000
      SELFSERVICE_FLOWS_ERROR_UI_URL: https://capsulezero.local/en/auth
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: https://capsulezero.local/en/profile
      # Recovery/verification run as code-method flows driven by the Go API
      # (spec 035); the UI URLs point at the app's flow-aware completion pages.
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: https://capsulezero.local/en/auth
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: https://capsulezero.local/en/verify-email
      SELFSERVICE_FLOWS_LOGIN_UI_URL: https://capsulezero.local/en/auth
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: https://capsulezero.local/en/auth

  # MailHog — dev-only courier sink for Kratos email (instead of Resend); inspect
  # at http://127.0.0.1:8025. Bound to loopback. Recovery/verification code
  # emails land here (spec 035); the MailHog-gated full-stack e2e reads the
  # one-time codes from its API.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks: [internal]
    ports:
      - "127.0.0.1:8025:8025"
