# Capsule Zero PROD edge — host (systemd) nginx terminates TLS and proxies to the prod
# web/API containers published on loopback by compose project `capsule-zero`.
# Install to /etc/nginx/sites-available/capsulezero.app.conf and symlink into sites-enabled.
# Targets nginx 1.28 (Ubuntu 26.04): `http2 on;` directive, not the legacy listen flag.

server {
    listen 80;
    listen [::]:80;
    server_name capsulezero.app www.capsulezero.app;
    include /etc/nginx/snippets/cz-request-guard.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capsulezero.app www.capsulezero.app;
    include /etc/nginx/snippets/cz-request-guard.conf;

    ssl_certificate     /etc/letsencrypt/live/capsulezero.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsulezero.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }

    # Public auth writes: login, registration, recovery/verification code
    # requests + completions, and password change — every path that verifies a
    # password or consumes a one-time code shares the strict bucket (spec 035).
    location ~ ^/api/auth/(registration|login|recovery(/complete)?|verification(/complete)?|password|google/(start|complete))/?$ {
        limit_req zone=capsule_auth_per_ip burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # Go API — public /api/* traffic reaches the monolith through the host edge.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # The Kratos public API is never exposed at the edge: every auth flow —
    # including recovery/verification code completion and emailed verification
    # links (which land on app routes via custom courier templates, spec 035) —
    # goes through the Go API, which drives Kratos over the internal network and
    # owns duplicate-identifier sanitization + the auth rate limit.
    #
    # Single exception (spec 037): Google redirects the browser back to the
    # Kratos OIDC callback, so exactly this path proxies to Kratos public on
    # loopback. Exact match — no other /self-service/* path is reachable.
    location = /self-service/methods/oidc/callback/google {
        limit_req zone=capsule_auth_per_ip burst=10 nodelay;

        proxy_pass http://127.0.0.1:4433;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    location ^~ /self-service/ { return 404; }
    location ^~ /sessions/     { return 404; }

    # Content-hashed wallpaper assets (spec 045). The filename carries a content
    # hash, so the bytes at a given URL never change — safe to cache immutably.
    # Next serves /public with `Cache-Control: max-age=0`, which forced a
    # revalidation round-trip of the wallpaper on every navigation; override it
    # so repeat visits and route changes reuse the cached image. Regenerating the
    # wallpaper mints a new hash (new URL), which busts the cache. A location-level
    # add_header replaces the server-level set, so the security headers are
    # re-declared here to keep them on the image response.
    location ~ ^/wall\.[0-9a-f]+\.(?:avif|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;

        proxy_hide_header Cache-Control;
        # No `always`: apply immutable caching only to 2xx/3xx. A 404/5xx for a
        # wallpaper URL (e.g. a deploy skew where the hashed asset briefly 404s)
        # must NOT be cached immutable for a year, or clients would be stuck on
        # the dark fallback with no revalidation. Errors fall back to the
        # browser's heuristic freshness instead.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
