# Capsule Zero PROD edge — host (systemd) nginx terminates TLS and proxies to the prod
# web/API containers published on loopback by compose project `capsule-zero`.
# Install to /etc/nginx/sites-available/capsulezero.app.conf and symlink into sites-enabled.
# Targets nginx 1.28 (Ubuntu 26.04): `http2 on;` directive, not the legacy listen flag.

server {
    listen 80;
    listen [::]:80;
    server_name capsulezero.app;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capsulezero.app;

    ssl_certificate     /etc/letsencrypt/live/capsulezero.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsulezero.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }

    # Public auth writes: login, registration, and recovery email requests.
    location ~ ^/api/auth/(registration|login|recovery)/?$ {
        limit_req zone=capsule_auth_per_ip burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # Go API — public /api/* traffic reaches the monolith through the host edge.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # Ory Kratos public API is intentionally NOT exposed at the edge in this slice.
    # All auth writes go through the Go API (/api/auth/*), which drives Kratos via
    # the API flow over the internal compose network and owns duplicate-identifier
    # sanitization + the auth rate limit. Exposing /self-service/{registration,login}
    # here would let callers bypass those controls, and recovery/verification browser
    # flows are deferred (disabled in kratos.yml) so no public self-service/session
    # path is needed yet. Deny explicitly; the recovery/verification slice re-adds the
    # exact paths it needs alongside the flow-aware completion UI.
    location ^~ /self-service/ { return 404; }
    location ^~ /sessions/     { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
