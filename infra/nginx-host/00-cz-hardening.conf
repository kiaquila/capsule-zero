# Capsule Zero request classification and conservative edge limits.
# This file is loaded in nginx's http{} context.

map $request_method $cz_method_allowed {
    default 0;
    GET     1;
    HEAD    1;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
    OPTIONS 1;
}

map $request_uri $cz_block_probe {
    default 0;
    ~*(?:^|/)\.(?:env|git|svn|hg|aws)(?:[./?~_-]|$) 1;
    ~*(?:^|/)(?:wp-admin|wp-login\.php|wp-config(?:\.php)?|wp-json|xmlrpc\.php|wordpress|phpmyadmin|pma|vendor/phpunit|phpunit|cgi-bin|actuator|server-status)(?:[/?]|$) 1;
    ~*(?:^|/)(?:docker-compose(?:\.[^/?]+)?|\.DS_Store|id_rsa|authorized_keys)(?:[/?]|$) 1;
    ~*(?:%2e%2e|%252e%252e|(?:^|/)\.\.(?:/|$)) 1;
}

limit_conn_zone $binary_remote_addr zone=cz_conn_per_ip:10m;
limit_req_zone  $binary_remote_addr zone=cz_general_per_ip:10m rate=30r/s;
limit_conn_status 429;

client_header_timeout 10s;
client_body_timeout 30s;
keepalive_timeout 30s;
send_timeout 30s;
reset_timedout_connection on;
