# Capsule Zero host-nginx edge — shared http-context settings.
# Install to /etc/nginx/conf.d/00-capsule-zero.conf on the droplet.
server_tokens off;
client_max_body_size 12m;

# Public auth endpoints are intentionally reachable before a user has a
# session, so throttle them at the edge before proxying to Go/Kratos.
limit_req_zone $binary_remote_addr zone=capsule_auth_per_ip:10m rate=10r/m;
limit_req_status 429;

# Next.js streaming / WebSocket upgrade support.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
