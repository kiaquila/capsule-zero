# Capsule Zero — Ory Kratos config (spec 024 Phase 2, auth slice).
#
# Non-secret config lives here with dev-friendly defaults. Secrets and
# environment-specific values are overridden by env vars in docker-compose:
#   DSN                          postgres://kratos:...@postgres:5432/kratos
#   COURIER_SMTP_CONNECTION_URI  smtp://mailhog:1025/?disable_starttls=true (dev)
#   SECRETS_COOKIE_0 / SECRETS_CIPHER_0   32-char secrets (prod)
#   SERVE_PUBLIC_BASE_URL        externally reachable Kratos public URL
#   SELFSERVICE_*                public app flow URLs (prod/dev compose)
#
# The Go API drives Kratos self-service via the API flow (server-side); the web
# UI is the existing /app forms, not Kratos's own UI.

version: v1.3.1

dsn: "postgres://kratos:placeholder-kratos-db-password@postgres:5432/kratos?sslmode=disable"

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:3000/
  allowed_return_urls:
    - http://127.0.0.1:3000
    - https://capsulezero.local
    - https://capsulezero.app

  methods:
    password:
      enabled: true
      config:
        # 8-char minimum matches the web Zod schema (createSignUpSchema).
        min_password_length: 8
        haveibeenpwned_enabled: false
    # Recovery/verification run on one-time codes only (spec 035): the link
    # method stays off so there is no alternate magic-link path to reason about.
    link:
      enabled: false
    code:
      enabled: true
      config:
        lifespan: 1h

  flows:
    error:
      ui_url: http://127.0.0.1:3000/error

    # The settings flow is driven server-side by the Go API (spec 035): it sets
    # the new password after a code recovery and on profile password change.
    # Both callers present a freshly-minted session (recovery continue_with or
    # a re-authenticated login), so privileged_session_max_age never bites.
    # The edge still returns 404 for /self-service/* — browsers never talk to
    # this flow directly.
    settings:
      ui_url: http://127.0.0.1:3000/profile
      privileged_session_max_age: 15m
      required_aal: highest_available

    # Recovery and verification are ENABLED with the one-time-code method
    # (spec 035): the Go API drives both as server-side API flows
    # (/api/auth/recovery*, /api/auth/verification*), and the web UI ships the
    # flow-aware completion steps (code entry). The edge still 404s
    # /self-service/* — nothing browser-side talks to Kratos directly.
    recovery:
      enabled: true
      use: code
      ui_url: http://127.0.0.1:3000/auth
      lifespan: 1h

    verification:
      enabled: true
      use: code
      ui_url: http://127.0.0.1:3000/verify-email
      lifespan: 1h

    login:
      ui_url: http://127.0.0.1:3000/auth
      lifespan: 10m

    registration:
      ui_url: http://127.0.0.1:3000/auth
      lifespan: 10m
      after:
        password:
          hooks:
            # Issue a session immediately on sign-up so the web UI logs the user
            # in without a second round-trip (founder decision 2026-07-03:
            # verification is non-blocking). With verification enabled, Kratos
            # also emails a confirmation code and reports the flow id via
            # continue_with, which the web verify-email banner consumes.
            - hook: session
            - hook: show_verification_ui

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - dev-only-kratos-cookie-secret-change-me-32
  cipher:
    - dev0only0kratos0cipher0secret032

ciphers:
  algorithm: xchacha20-poly1305

# Kratos v1.3: native (API-flow) code recovery hands the session back via
# continue_with set_ory_session_token only behind this flag; without it the
# flow dead-ends in a browser redirect the Go API cannot follow (v1.1 had no
# supported native path at all — the reason for the v1.1.0 → v1.3.1 bump,
# spec 035).
feature_flags:
  use_continue_with_transitions: true

hashers:
  algorithm: argon2
  argon2:
    parallelism: 1
    memory: 128MB
    # OWASP Argon2id minimum is t >= 2 (spec 034). The local dev stack overrides
    # this to 1 via HASHERS_ARGON2_ITERATIONS in docker-compose.dev.yml so
    # full-stack e2e keeps its measured sign-up timings; production hashes with
    # the value below.
    iterations: 2
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailhog:1025/?disable_starttls=true
    from_address: no-reply@capsulezero.app
    from_name: Capsule Zero
  templates:
    # Custom code-method emails (spec 035): recovery emails contain the code
    # only, because Kratos does not expose RecoveryURL for recovery_code.valid;
    # verification links land on the app route carrying code+flow. /self-service/*
    # stays closed at the nginx edge. The verification template rewrites only
    # the path; the origin comes from SERVE_PUBLIC_BASE_URL, which points at the
    # app origin in every env.
    recovery_code:
      valid:
        email:
          body:
            html: file:///etc/config/kratos/templates/recovery_code.valid.email.body.gotmpl
            plaintext: file:///etc/config/kratos/templates/recovery_code.valid.email.body.plaintext.gotmpl
    verification_code:
      valid:
        email:
          body:
            html: file:///etc/config/kratos/templates/verification_code.valid.email.body.gotmpl
            plaintext: file:///etc/config/kratos/templates/verification_code.valid.email.body.plaintext.gotmpl
