# Reverse proxy for https://capsulezero.app
#
# TLS material lives at /etc/letsencrypt/live/capsulezero.app/{fullchain,privkey}.pem
# and is bootstrapped via `certbot certonly --standalone` on the host before the
# stack comes up the first time. Renewal uses the webroot challenge served from
# /var/www/certbot before app proxying on both :80 and :443.
#
# See docs_capsule_zero/project/devops/nginx-reverse-proxy.md.

upstream capsule_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name capsulezero.app;

    location = /nginx-health {
        access_log off;
        default_type "text/plain";
        return 200 "ok\n";
    }

    # ACME http-01 challenge for `certbot renew --webroot`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capsulezero.app;

    ssl_certificate     /etc/letsencrypt/live/capsulezero.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsulezero.app/privkey.pem;

    # Mozilla intermediate (2024) — TLS 1.2 + 1.3, no weak ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME http-01 challenge may arrive on HTTPS after Cloudflare redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://capsule_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js streaming + HMR-style WebSocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
