# Reverse proxy for https://capsulezero.app
#
# TLS material lives at /etc/letsencrypt/live/capsulezero.app/{fullchain,privkey}.pem
# and is bootstrapped via `certbot certonly --standalone` on the host before the
# stack comes up the first time. Renewal uses the webroot challenge served from
# /var/www/certbot before app proxying on both :80 and :443.
#
# See docs_capsule_zero/project/devops/nginx-reverse-proxy.md.

server {
    listen 80;
    listen [::]:80;
    server_name capsulezero.app;

    location = /nginx-health {
        access_log off;
        default_type "text/plain";
        return 200 "ok\n";
    }

    # ACME http-01 challenge for `certbot renew --webroot`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capsulezero.app;

    ssl_certificate     /etc/letsencrypt/live/capsulezero.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsulezero.app/privkey.pem;

    # Variable proxy_pass re-resolves containers through Docker DNS after replacement.
    set $capsule_web_origin http://web:3000;
    set $capsule_api_origin http://api:8080;
    set $capsule_kratos_origin http://kratos:4433;

    # Mozilla intermediate (2024) — TLS 1.2 + 1.3, no weak ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME http-01 challenge may arrive on HTTPS after Cloudflare redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Public auth writes: login, registration, recovery/verification code
    # requests + completions, and password change — every path that verifies a
    # password or consumes a one-time code shares the strict bucket (spec 035).
    location ~ ^/api/auth/(registration|login|recovery(/complete)?|verification(/complete)?|password)/?$ {
        limit_req zone=capsule_auth_per_ip burst=10 nodelay;

        proxy_pass $capsule_api_origin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # Go API — the browser reaches the monolith only through here.
    location /api/ {
        proxy_pass $capsule_api_origin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite any client-supplied value so the Go auth rate limiter keys on
        # a trusted address, not a spoofable one.
        proxy_set_header X-Capsule-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # The Kratos public API is never exposed at the edge: every auth flow —
    # including recovery/verification code completion and emailed links (which
    # land on app routes via custom courier templates, spec 035) — goes through
    # the Go API, which drives Kratos over the internal network and owns
    # duplicate-identifier sanitization + the auth rate limit.


    location ^~ /self-service/ { return 404; }
    location ^~ /sessions/     { return 404; }

    location / {
        proxy_pass $capsule_web_origin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js streaming + HMR-style WebSocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
