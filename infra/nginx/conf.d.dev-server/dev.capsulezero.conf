# Reverse proxy for https://dev.capsulezero.app (dev SERVER environment).
#
# Mounted into the dedicated dev nginx (project `capsule-zero-dev`) via
# docker-compose.dev-server.yml. Listens on container :443 (published to host :8443);
# Cloudflare proxies dev.capsulezero.app and rewrites the origin port to 8443.
#
# TLS material lives at /etc/letsencrypt/live/dev.capsulezero.app/{fullchain,privkey}.pem,
# issued via certbot DNS-01 (Cloudflare plugin) on the host — see
# docs_capsule_zero/project/devops/dev-cd-pipeline.md. First-deploy bootstrap uses a
# self-signed cert at the same path until the real LE cert is issued.

server {
    listen 80;
    listen [::]:80;
    server_name dev.capsulezero.app;

    # Internal-only (host :80 is not published for the dev stack). Used by the
    # container healthcheck and as an ACME http-01 fallback.
    location = /nginx-health {
        access_log off;
        default_type "text/plain";
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.capsulezero.app;

    ssl_certificate     /etc/letsencrypt/live/dev.capsulezero.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.capsulezero.app/privkey.pem;

    # Variable proxy_pass re-resolves `web` through Docker DNS after container replacement.
    set $capsule_web_origin http://web:3000;

    # Mozilla intermediate (2024) — matches the prod vhost.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # HSTS intentionally omitted on dev so a stuck pin never surprises a developer who
    # later disables TLS for this host (same rationale as the local dev vhost).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass $capsule_web_origin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js streaming + HMR-style WebSocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
