# Dev-only nginx vhost for `capsulezero.local` (mkcert-issued certificate).
#
# Mounted into the SAME nginx:1.27-alpine image we run in production, via
# `docker-compose.dev.yml`. The image, the base `nginx.conf`, and the `web`
# container are byte-for-byte identical to prod — only this vhost file,
# the cert bind-mount, and `NEXT_PUBLIC_APP_URL` differ.
#
# HSTS is intentionally omitted in dev: browsers persist HSTS per-host, and
# we do not want a stuck `capsulezero.local` HSTS pin to surprise a developer
# who later disables TLS locally.

server {
    listen 80;
    listen [::]:80;
    server_name capsulezero.local;

    location = /nginx-health {
        access_log off;
        default_type "text/plain";
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capsulezero.local;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Variable proxy_pass re-resolves `web` through Docker DNS after container replacement.
    set $capsule_web_origin http://web:3000;

    # Mozilla intermediate (2024) — matches the prod vhost.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass $capsule_web_origin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }
}
