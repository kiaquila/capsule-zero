user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Docker embedded DNS lets variable proxy targets survive container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 10 MB upload ceiling per Capsule Zero spec, plus multipart overhead.
    client_max_body_size 12m;

    # Cloudflare edge → real client IP (ngx_http_realip_module). Behind
    # Cloudflare the TCP peer is a Cloudflare POP, so without this $remote_addr
    # (and $binary_remote_addr, used by the auth limit_req below and by the Go
    # throttle key forwarded as X-Capsule-Client-IP) would be the POP — which
    # both shares one rate-limit bucket across unrelated users behind the same
    # POP and lets a direct-to-origin caller forge CF-Connecting-IP. realip
    # trusts CF-Connecting-IP ONLY for connections originating from a Cloudflare
    # range, so a direct-origin forgery is ignored and keys on the attacker's
    # real address instead. Source: https://www.cloudflare.com/ips/ — keep in
    # sync with infra/nginx-host/00-capsule-zero.conf and refresh when Cloudflare
    # updates its ranges (tracked in spec 024 Known Issues).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Public auth endpoints are intentionally reachable before a user has a
    # session, so throttle them at the edge before proxying to Go/Kratos.
    limit_req_zone $binary_remote_addr zone=capsule_auth_per_ip:10m rate=10r/m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Used by Next.js WebSocket / HMR / streaming responses.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
