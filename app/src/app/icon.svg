<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* Capsule Zero "CZ" favicon — the founder-approved V5 monogram
       letterforms (initials of "Capsule Zero"; Helvetica Neue Bold,
       font-size 300, letter-spacing -6, centered; exact font vectors
       baked to paths so the mark is font-independent) recolored
       achromatic and theme-adaptive, the way the first favicon
       iteration was implemented: light browser chrome -> near-black
       mark, dark browser chrome -> light grey-white mark (achromatic
       family, constitution §III). The dark plate of the previous
       iteration is retired: the mark adapts its ink to the tab strip
       instead of carrying its own background surface. */
    .cz-mark { fill: #1C1C1C; }
    @media (prefers-color-scheme: dark) { .cz-mark { fill: #EDEDED; } }
  </style>
