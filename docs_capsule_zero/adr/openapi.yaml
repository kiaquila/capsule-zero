openapi: 3.1.0
info:
  title: Capsule Zero API
  version: 0.1.0
  description: >
    Sprint 0 implementation contract for the v0.1 REST boundary. This file is
    the source for generated TypeScript clients consumed by both the Next.js web frontend and the React Native mobile app.
    Monetization is on hold under PRODUCT-PLAN.md D2: no coin balance, billing,
    payment-provider, purchase, or payment-webhook surface is part of the
    authoritative contract until Stage 4 selects a new model.
    Shared merchant-image import/search is also absent under PRODUCT-PLAN.md
    Q8: it may return only after the compliance-scheme spec and external legal
    review are complete.
x-status: sprint-0-foundation
x-monetization-status: on-hold
x-shared-merchant-catalog-status: blocked-pending-compliance-spec-and-legal-review
servers:
  - url: https://{host}
    variables:
      host:
        default: app.capsule-zero.local
security:
  - bearerSession: []
  - sessionToken: []
tags:
  - name: Auth
  - name: Profile
  - name: Journey
  - name: Capsules
  - name: Items
  - name: Uploads
  - name: Health
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: Kratos session token
      description: >
        Session token returned by `/api/auth/login` or `/api/auth/registration`
        and forwarded as `Authorization: Bearer <token>`.
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: >
        Alternate server-to-server session token header consumed by the Go API.
  parameters:
    capsuleId:
      in: path
      name: capsuleId
      required: true
      schema:
        type: string
        format: uuid
    entryId:
      in: path
      name: entryId
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Kratos session is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user cannot access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency, version, or state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The per-client request budget is exhausted temporarily.
      headers:
        Retry-After:
          description: Seconds until the client should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SemanticValidation:
      description: Domain rule validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Temporary server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream identity service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The feature is disabled or a required runtime dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_CODE
        - INVALID_CURRENT_PASSWORD
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - IDEMPOTENCY_CONFLICT
        - SEMANTIC_VALIDATION_FAILED
        - RATE_LIMITED
        - FEATURE_UNAVAILABLE
        - STORAGE_UNAVAILABLE
        - UPLOAD_INCOMPLETE
        - UPLOAD_MISMATCH
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Locale:
      type: string
      enum: [en, ru]
    WardrobeType:
      type: string
      enum: [women, men, mixed]
    ItemStatus:
      type: string
      enum: [active, uncapsulated, for_sale, for_repair]
    SourceType:
      type: string
      enum: [photo_upload, catalog]
    Visibility:
      type: string
      enum: [private, public]
    ProcessingStatus:
      type: string
      enum: [queued, processing, completed, failed, retryable]
    ColorDot:
      type: object
      required: [id, name, hex, group]
      properties:
        id:
          type: string
          pattern: "^[ABPDK][0-9]{1,2}$"
        name:
          type: string
        hex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        group:
          type: string
          enum: [achromatic, bright, pastel, desaturated, dark]
    AlgorithmRole:
      type: string
      enum:
        [
          core_top,
          core_bottom,
          core_dress,
          core_shoes,
          layering_mid,
          layering_outer,
          accessory,
        ]
    AccessorySlot:
      type: string
      enum: [bag, headwear, neckwear, jewelry, belt, eyewear]
    ImpactUnit:
      type: string
      enum: [core_base_looks, layering_coverage_percentage_points]
    LayeringCoverage:
      type: object
      required:
        [
          score,
          baseLookCount,
          midCoveredLookCount,
          outerCoveredLookCount,
        ]
      properties:
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        baseLookCount:
          type: integer
          minimum: 0
        midCoveredLookCount:
          type: integer
          minimum: 0
        outerCoveredLookCount:
          type: integer
          minimum: 0
    Category:
      type: object
      required:
        [id, name, wardrobeTypes, layer, algorithmRole, accessorySlot]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        wardrobeTypes:
          type: array
          items:
            $ref: "#/components/schemas/WardrobeType"
        layer:
          type: string
          enum:
            [tops, dresses_skirts, bottoms, outerwear, shoes, bags, accessories]
        algorithmRole:
          $ref: "#/components/schemas/AlgorithmRole"
        accessorySlot:
          oneOf:
            - $ref: "#/components/schemas/AccessorySlot"
            - type: "null"
    AuthLocation:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
    AuthUser:
      type: object
      required: [id, email, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        location:
          $ref: "#/components/schemas/AuthLocation"
        emailVerified:
          type: boolean
          description: >-
            Whether every verifiable address on the identity is confirmed. The
            web app shows the verify-email banner while false.
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [requiresEmailConfirmation]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        user:
          $ref: "#/components/schemas/AuthUser"
        profile:
          $ref: "#/components/schemas/Profile"
        requiresEmailConfirmation:
          type: boolean
        verificationFlowId:
          type: string
          description: >-
            Present on registration when Kratos started an email verification
            flow for the new address; the emailed code must be submitted
            against this flow via /api/auth/verification/complete.
    AuthRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          $ref: "#/components/schemas/Locale"
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthProvidersResponse:
      type: object
      required: [google]
      properties:
        google:
          type: boolean
          description: Whether this deployment offers Google sign-in (spec 037).
    AuthGoogleStartRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          format: uri
          description: >-
            App callback URL Kratos redirects the browser to after the
            provider dance; must be inside the Kratos allowed_return_urls.
    AuthGoogleStartResponse:
      type: object
      required: [redirectUrl, exchangeCode]
      properties:
        redirectUrl:
          type: string
          format: uri
          description: Google consent-screen URL the browser must visit.
        exchangeCode:
          type: string
          description: >-
            Session-token exchange (init) code; the completion call presents
            it together with the callback's return_to code.
    AuthGoogleCompleteRequest:
      type: object
      required: [exchangeCode, returnToCode]
      properties:
        exchangeCode:
          type: string
        returnToCode:
          type: string
          description: Code Kratos appended to the callback redirect.
    AuthRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthRecoveryResponse:
      type: object
      required: [delivery, email, flowId]
      properties:
        delivery:
          type: string
          enum: [email]
        email:
          type: string
          format: email
        flowId:
          type: string
          description: >-
            Kratos flow the emailed one-time code is bound to; completion must
            submit the code against this flow.
    AuthRecoveryCompleteRequest:
      type: object
      required: [newPassword]
      properties:
        flowId:
          type: string
          description: Required with `code` for the first completion attempt.
        code:
          type: string
          description: Required with `flowId` for the first completion attempt.
        newPassword:
          type: string
          minLength: 8
        recoveryContinuationId:
          type: string
          description: >-
            Opaque retry id returned in `error.details.recoveryContinuationId`
            when the recovery code was valid but the submitted password was
            rejected by Kratos policy. Retrying with this id lets the user
            choose a different password without consuming the already-used
            recovery code again.
    AuthVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthVerificationResponse:
      type: object
      required: [delivery, email, flowId]
      properties:
        delivery:
          type: string
          enum: [email]
        email:
          type: string
          format: email
        flowId:
          type: string
    AuthVerificationCompleteRequest:
      type: object
      required: [flowId, code]
      properties:
        flowId:
          type: string
        code:
          type: string
    AuthPasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    AuthOkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    AuthLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Profile:
      type: object
      required:
        [userId, email, displayName, locale, createdAt, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        country:
          type: string
        city:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          $ref: "#/components/schemas/Locale"
        # Set-or-leave semantics: an omitted field keeps the stored value. `null`
        # is intentionally not accepted — the Go handler treats a missing pointer
        # as "leave unchanged" (COALESCE), so advertising a nullable "clear" that
        # the API silently ignores would mislead clients. Clearing a saved field
        # is a deferred feature (see spec 024 Known Issues).
        country:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Absolute https URL of the avatar image.
    AvatarRequest:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
          format: uuid
    PaletteValidationRequest:
      type: object
      required: [colorIds]
      properties:
        colorIds:
          type: array
          minItems: 1
          maxItems: 15
          items:
            type: string
    PaletteValidationResponse:
      type: object
      required: [compatible, blockedColorIds, explanation]
      properties:
        compatible:
          type: boolean
        blockedColorIds:
          type: array
          items:
            type: string
        explanation:
          type: [string, "null"]
    CustomCategoryValidationRequest:
      type: object
      required: [name, wardrobeType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
    CustomCategoryValidationResponse:
      type: object
      required:
        [accepted, explanation, alternatives, algorithmRole, accessorySlot]
      properties:
        accepted:
          type: boolean
        explanation:
          type: string
        alternatives:
          type: array
          items:
            type: string
        algorithmRole:
          oneOf:
            - $ref: "#/components/schemas/AlgorithmRole"
            - type: "null"
        accessorySlot:
          oneOf:
            - $ref: "#/components/schemas/AccessorySlot"
            - type: "null"
    Capsule:
      type: object
      required:
        [
          id,
          name,
          wardrobeType,
          paletteColorIds,
          paletteLocked,
          itemCount,
          outfitCount,
          opr,
          layeringCoverage,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
        paletteColorIds:
          type: array
          items:
            type: string
        paletteLocked:
          type: boolean
        itemCount:
          type: integer
        outfitCount:
          type: integer
        opr:
          type: number
        layeringCoverage:
          $ref: "#/components/schemas/LayeringCoverage"
    CreateCapsuleRequest:
      type: object
      required: [name, wardrobeType, categoryTargets, paletteColorIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
        categoryTargets:
          type: array
          minItems: 8
          items:
            type: object
            required: [categoryId, quantity]
            properties:
              categoryId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        paletteColorIds:
          type: array
          minItems: 1
          items:
            type: string
    UpdateCapsuleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    Item:
      type: object
      required:
        [
          id,
          name,
          categoryId,
          colorIds,
          sourceType,
          visibility,
          imageUrl,
          fromCatalog,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        visibility:
          $ref: "#/components/schemas/Visibility"
        imageUrl:
          type: string
        fromCatalog:
          type: boolean
        favorite:
          type: boolean
        status:
          $ref: "#/components/schemas/ItemStatus"
        version:
          type: integer
          minimum: 1
    CreateItemRequest:
      type: object
      required: [name, categoryId, colorIds, sourceType]
      properties:
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        assetId:
          type: [string, "null"]
          format: uuid
    UpdateItemRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock value from the current item payload.
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
    FavoriteRequest:
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean
    UpdateItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"
    AddCapsuleItemRequest:
      type: object
      required: [wardrobeEntryId]
      properties:
        wardrobeEntryId:
          type: string
          format: uuid
    ReplaceCapsuleItemRequest:
      type: object
      required: [replacementWardrobeEntryId]
      properties:
        replacementWardrobeEntryId:
          type: string
          format: uuid
    Outfit:
      type: object
      required: [id, itemIds]
      properties:
        id:
          type: string
          format: uuid
        itemIds:
          type: array
          items:
            type: string
            format: uuid
    GapRecommendation:
      type: object
      required: [id, categoryId, priority, impact, impactUnit]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]
        impact:
          type: number
        impactUnit:
          $ref: "#/components/schemas/ImpactUnit"
    PhotoUploadInitRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^(?!\\.\\.?$)[^/\\\\]+$"
          description: Original basename for validation/audit only; never used as the object key.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
    PhotoUploadInitResponse:
      type: object
      description: >-
        Direct-upload contract. Clients must send every returned upload header.
        The presigned URL is sensitive and may reveal provider routing details,
        the bucket name, and the server-generated object key; never log it.
      required: [jobId, assetId, uploadUrl, uploadHeaders, expiresAt]
      properties:
        jobId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: Exact request headers signed into the PUT URL, including Content-Type.
        expiresAt:
          type: string
          format: date-time
    PhotoUploadCompleteRequest:
      type: object
      required: [jobId, assetId]
      properties:
        jobId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
    PhotoUploadCompleteResponse:
      type: object
      required: [id, assetId, jobType, status]
      properties:
        id:
          type: string
          format: uuid
          description: Upload job id.
        assetId:
          type: string
          format: uuid
          description: Stable original asset id returned by init and idempotent completion.
        jobType:
          type: string
          enum: [photo_upload]
        status:
          type: string
          enum: [completed]
    BackgroundRemovalRequest:
      type: object
      properties:
        forceRetry:
          type: boolean
          default: false
    UploadJob:
      type: object
      required: [id, status, jobType]
      properties:
        id:
          type: string
          format: uuid
        jobType:
          type: string
          enum: [photo_upload, background_removal]
        status:
          $ref: "#/components/schemas/ProcessingStatus"
        durationMs:
          type: [integer, "null"]
        errorMessage:
          type: [string, "null"]
    MessageResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    HealthResponse:
      type: object
      description: >-
        Deployment health probe with build identity. `commit` and `builtAt`
        are stamped at link time (`-ldflags -X`, see api/Dockerfile); a build
        without injection reports "unknown", never an empty string.
      required: [ok, commit, builtAt, postgres, kratos, storage]
      properties:
        ok:
          type: boolean
        commit:
          type: string
          description: Git commit SHA of the running build, or "unknown".
        builtAt:
          type: string
          description: RFC 3339 build timestamp, or "unknown".
        postgres:
          type: string
          enum: [ok, error]
        kratos:
          type: string
          enum: [ok, error]
        storage:
          type: string
          enum: [ok, error]
    IdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
paths:
  /api/auth/registration:
    post:
      tags: [Auth]
      operationId: registerWithPassword
      x-auth: public
      security: []
      summary: Create a password account and return a session or email-confirmation state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegistrationRequest"
      responses:
        "200":
          description: Registration completed, or email confirmation is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "500":
          $ref: "#/components/responses/InternalServerError"
        default:
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      x-auth: public
      security: []
      summary: Establish a password session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Authenticated session and mapped profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/whoami:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      x-auth: public
      security: []
      summary: Resolve the presented session token, or return an empty auth response.
      responses:
        "200":
          description: Current session response; empty when no valid session is presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          $ref: "#/components/responses/InternalServerError"
  /api/auth/recovery:
    post:
      tags: [Auth]
      operationId: requestPasswordRecovery
      x-auth: public
      security: []
      summary: Start code-method password recovery without revealing whether the account exists.
      description: >-
        Sends a one-time recovery code by email (Kratos code method, spec 035)
        and returns the flow the code is bound to. The response shape is
        identical for known and unknown addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRecoveryRequest"
      responses:
        "200":
          description: Recovery request accepted for email delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/recovery/complete:
    post:
      tags: [Auth]
      operationId: completePasswordRecovery
      x-auth: public
      security: []
      summary: Exchange the emailed recovery code for a new password and a session.
      description: >-
        Submits the one-time code against its flow, sets the new password, and
        signs the user in (spec 035). A wrong or expired code is a validation
        error and never issues a session. If Kratos accepts the code but rejects
        the password policy, the `400 VALIDATION_ERROR` response includes
        `error.details.recoveryContinuationId`; clients retry with that id and
        a different `newPassword` instead of resubmitting the consumed code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRecoveryCompleteRequest"
      responses:
        "200":
          description: Password replaced; authenticated session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/verification:
    post:
      tags: [Auth]
      operationId: startEmailVerification
      x-auth: public
      security: []
      summary: Start or resend a code-method email verification without revealing whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerificationRequest"
      responses:
        "200":
          description: Verification request accepted for email delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/verification/complete:
    post:
      tags: [Auth]
      operationId: completeEmailVerification
      x-auth: public
      security: []
      summary: Confirm the email address with the emailed verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerificationCompleteRequest"
      responses:
        "200":
          description: Address verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      x-auth: session
      summary: Change the password of the signed-in user (current password required).
      description: >-
        Verifies the current password by re-authenticating (which also mints
        the privileged session Kratos requires) before setting the new one
        via the settings flow (spec 035).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordChangeRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/providers:
    get:
      tags: [Auth]
      operationId: getAuthProviders
      x-auth: public
      security: []
      summary: Report which social sign-in providers this deployment offers.
      responses:
        "200":
          description: Provider availability map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"
        default:
          $ref: "#/components/responses/InternalServerError"
  /api/auth/google/start:
    post:
      tags: [Auth]
      operationId: startGoogleSignIn
      x-auth: public
      security: []
      summary: Begin the native Google OIDC flow (spec 037).
      description: >-
        Creates a Kratos API login flow with a session-token exchange code and
        returns the Google consent URL for the browser plus the exchange code
        the completion call must present. 404 while Google sign-in is
        disabled for the deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthGoogleStartRequest"
      responses:
        "200":
          description: Consent redirect URL and exchange code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthGoogleStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/google/complete:
    post:
      tags: [Auth]
      operationId: completeGoogleSignIn
      x-auth: public
      security: []
      summary: Exchange the Google callback codes for an authenticated session.
      description: >-
        Trades the start call's exchange code plus the return_to code from the
        Kratos callback redirect for a session token; answers with the
        standard auth response. Wrong, expired, or reused codes are rejected
        with GOOGLE_SIGN_IN_FAILED and never issue a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthGoogleCompleteRequest"
      responses:
        "200":
          description: Authenticated session and mapped profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-auth: public
      security: []
      summary: Revoke the presented session token; idempotent when absent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Logout request completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          $ref: "#/components/responses/BadGateway"
