              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: >-
            Degraded deployment — a dependency probe failed. The body still
            carries build info so the CD verifier can read the running commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
