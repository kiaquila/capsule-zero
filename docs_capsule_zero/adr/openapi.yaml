openapi: 3.1.0
info:
  title: Capsule Zero API
  version: 0.1.0
  description: >
    Sprint 0 implementation contract for the v0.1 REST boundary. This file is
    the source for generated TypeScript clients consumed by both the Next.js web frontend and the React Native mobile app.
x-status: sprint-0-foundation
servers:
  - url: https://{host}
    variables:
      host:
        default: app.capsule-zero.local
security:
  - kratosSession: []
tags:
  - name: Auth
  - name: Profile
  - name: Journey
  - name: Capsules
  - name: Items
  - name: Uploads
  - name: Imports
  - name: Catalog
  - name: Billing
  - name: Admin
  - name: Health
components:
  securitySchemes:
    kratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: >
        Ory Kratos browser session cookie forwarded through nginx and
        revalidated by the Go API on authenticated requests.
    lavaWebhookKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    capsuleId:
      in: path
      name: capsuleId
      required: true
      schema:
        type: string
        format: uuid
    entryId:
      in: path
      name: entryId
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid
    importId:
      in: path
      name: importId
      required: true
      schema:
        type: string
        format: uuid
    invoiceId:
      in: path
      name: invoiceId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Kratos session is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientBalance:
      description: User does not have enough coins for the requested paid action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user cannot access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency, version, or state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SemanticValidation:
      description: Domain rule validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Temporary server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream identity service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - IDEMPOTENCY_CONFLICT
        - SEMANTIC_VALIDATION_FAILED
        - INSUFFICIENT_BALANCE
        - WEBHOOK_AUTH_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Locale:
      type: string
      enum: [en, ru]
    WardrobeType:
      type: string
      enum: [women, men, mixed]
    ItemStatus:
      type: string
      enum: [active, uncapsulated, for_sale, for_repair]
    SourceType:
      type: string
      enum: [photo_upload, marketplace, catalog]
    Visibility:
      type: string
      enum: [private, moderation_pending, public]
    ModerationStatus:
      type: string
      enum: [none, pending, approved, rejected]
    ProcessingStatus:
      type: string
      enum: [queued, processing, completed, failed, retryable]
    ColorDot:
      type: object
      required: [id, name, hex, group]
      properties:
        id:
          type: string
          pattern: "^[ABPDK][0-9]{1,2}$"
        name:
          type: string
        hex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        group:
          type: string
          enum: [achromatic, bright, pastel, desaturated, dark]
    Category:
      type: object
      required: [id, name, wardrobeTypes, layer]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        wardrobeTypes:
          type: array
          items:
            $ref: "#/components/schemas/WardrobeType"
        layer:
          type: string
          enum:
            [tops, dresses_skirts, bottoms, outerwear, shoes, bags, accessories]
    AuthLocation:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
    AuthUser:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        location:
          $ref: "#/components/schemas/AuthLocation"
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [requiresEmailConfirmation]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        user:
          $ref: "#/components/schemas/AuthUser"
        profile:
          $ref: "#/components/schemas/Profile"
        requiresEmailConfirmation:
          type: boolean
    AuthRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          $ref: "#/components/schemas/Locale"
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    AuthRecoveryResponse:
      type: object
      required: [delivery, email]
      properties:
        delivery:
          type: string
          enum: [email]
        email:
          type: string
          format: email
    AuthLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Profile:
      type: object
      required:
        [userId, email, displayName, locale, coinBalance, createdAt, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        country:
          type: string
        city:
          type: string
        coinBalance:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          $ref: "#/components/schemas/Locale"
        country:
          type: [string, "null"]
          maxLength: 80
        city:
          type: [string, "null"]
          maxLength: 80
        avatarUrl:
          type: [string, "null"]
    AvatarRequest:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
          format: uuid
    PaletteValidationRequest:
      type: object
      required: [colorIds]
      properties:
        colorIds:
          type: array
          minItems: 1
          maxItems: 15
          items:
            type: string
    PaletteValidationResponse:
      type: object
      required: [compatible, blockedColorIds, explanation]
      properties:
        compatible:
          type: boolean
        blockedColorIds:
          type: array
          items:
            type: string
        explanation:
          type: [string, "null"]
    CustomCategoryValidationRequest:
      type: object
      required: [name, wardrobeType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
    CustomCategoryValidationResponse:
      type: object
      required: [accepted, explanation, alternatives]
      properties:
        accepted:
          type: boolean
        explanation:
          type: string
        alternatives:
          type: array
          items:
            type: string
    Capsule:
      type: object
      required:
        [
          id,
          name,
          wardrobeType,
          paletteColorIds,
          paletteLocked,
          itemCount,
          outfitCount,
          opr,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
        paletteColorIds:
          type: array
          items:
            type: string
        paletteLocked:
          type: boolean
        itemCount:
          type: integer
        outfitCount:
          type: integer
        opr:
          type: number
    CreateCapsuleRequest:
      type: object
      required: [name, wardrobeType, categoryTargets, paletteColorIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        wardrobeType:
          $ref: "#/components/schemas/WardrobeType"
        categoryTargets:
          type: array
          minItems: 8
          items:
            type: object
            required: [categoryId, quantity]
            properties:
              categoryId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        paletteColorIds:
          type: array
          minItems: 1
          items:
            type: string
    UpdateCapsuleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    Item:
      type: object
      required:
        [
          id,
          name,
          categoryId,
          colorIds,
          sourceType,
          visibility,
          imageUrl,
          fromCatalog,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        visibility:
          $ref: "#/components/schemas/Visibility"
        imageUrl:
          type: string
        fromCatalog:
          type: boolean
        favorite:
          type: boolean
        status:
          $ref: "#/components/schemas/ItemStatus"
        version:
          type: integer
          minimum: 1
    CreateItemRequest:
      type: object
      required: [name, categoryId, colorIds, sourceType]
      properties:
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        assetId:
          type: [string, "null"]
          format: uuid
        catalogItemId:
          type: [string, "null"]
          format: uuid
    UpdateItemRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock value from the current item payload.
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        brand:
          type: [string, "null"]
        material:
          type: [string, "null"]
        price:
          type: [number, "null"]
    FavoriteRequest:
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean
    UpdateItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"
    AddCapsuleItemRequest:
      type: object
      required: [wardrobeEntryId]
      properties:
        wardrobeEntryId:
          type: string
          format: uuid
    ReplaceCapsuleItemRequest:
      type: object
      required: [replacementWardrobeEntryId]
      properties:
        replacementWardrobeEntryId:
          type: string
          format: uuid
    Outfit:
      type: object
      required: [id, itemIds]
      properties:
        id:
          type: string
          format: uuid
        itemIds:
          type: array
          items:
            type: string
            format: uuid
    GapRecommendation:
      type: object
      required: [id, categoryId, priority, impact]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]
        impact:
          type: number
    PhotoUploadInitRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          maximum: 10485760
        exifOrientation:
          type: [integer, "null"]
          description: Mobile EXIF orientation value to normalize before processing.
        checksum:
          type: [string, "null"]
          description: Client image hash used to deduplicate paid processing.
    PhotoUploadInitResponse:
      type: object
      required: [jobId, assetId, uploadUrl, storagePath]
      properties:
        jobId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        storagePath:
          type: string
    PhotoUploadCompleteRequest:
      type: object
      required: [jobId, assetId]
      properties:
        jobId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
    BackgroundRemovalRequest:
      type: object
      properties:
        forceRetry:
          type: boolean
          default: false
    UploadJob:
      type: object
      required: [id, status, jobType]
      properties:
        id:
          type: string
          format: uuid
        jobType:
          type: string
          enum:
            [
              photo_upload,
              background_removal,
              marketplace_parse,
              item_embedding,
            ]
        status:
          $ref: "#/components/schemas/ProcessingStatus"
        durationMs:
          type: [integer, "null"]
        errorMessage:
          type: [string, "null"]
    MarketplaceImportRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uri
    MarketplaceParsedCandidate:
      type: object
      required:
        [sourceUrl, title, imageUrls, suggestedCategoryId, suggestedColorIds]
      properties:
        sourceUrl:
          type: string
          format: uri
        title:
          type: string
        imageUrls:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        price:
          type: [number, "null"]
        currency:
          type: [string, "null"]
        brand:
          type: [string, "null"]
        suggestedCategoryId:
          type: [string, "null"]
          format: uuid
        suggestedColorIds:
          type: array
          items:
            type: string
    MarketplaceImport:
      type: object
      required: [id, status, candidates]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProcessingStatus"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceParsedCandidate"
    MarketplaceConfirmRequest:
      type: object
      required: [candidateIndex, name, categoryId, colorIds]
      properties:
        candidateIndex:
          type: integer
          minimum: 0
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        colorIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        selectedImageUrl:
          type: string
          format: uri
    CatalogSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    LavaInvoiceRequest:
      type: object
      required: [coinPackId, idempotencyKey]
      properties:
        coinPackId:
          type: string
          enum: [coins_5, coins_15, coins_30]
        idempotencyKey:
          type: string
          minLength: 12
          maxLength: 128
    LavaInvoiceResponse:
      type: object
      required: [invoiceId, paymentUrl]
      properties:
        invoiceId:
          type: string
        paymentUrl:
          type: string
          format: uri
    LavaStatusResponse:
      type: object
      required: [invoiceId, status]
      properties:
        invoiceId:
          type: string
        status:
          type: string
          enum: [pending, paid, failed, expired, refunded]
        coinDelta:
          type: [integer, "null"]
    CoinSpendRequest:
      type: object
      required: [reason, idempotencyKey]
      properties:
        reason:
          type: string
          enum: [extra_capsule, photo_enhancement]
        targetId:
          type: [string, "null"]
          format: uuid
          description: >
            reason=extra_capsule requires the capsule UUID that receives the
            extra slot. reason=photo_enhancement requires the item UUID or
            upload job UUID being enhanced. Null is rejected for both v0.1
            reasons unless a future server-owned reason explicitly allows it.
        idempotencyKey:
          type: string
          minLength: 12
          maxLength: 128
    CoinSpendResponse:
      type: object
      required: [ledgerEntryId, coinBalance, coinDelta, reason]
      properties:
        ledgerEntryId:
          type: string
          format: uuid
        coinBalance:
          type: integer
          minimum: 0
        coinDelta:
          type: integer
          maximum: -1
        reason:
          type: string
          enum: [extra_capsule, photo_enhancement]
    LavaWebhookPayload:
      type: object
      required: [eventId, eventType, invoiceId, status, coinPackId]
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum: [payment.success, payment.failed, payment.refunded]
        invoiceId:
          type: string
        status:
          type: string
        coinPackId:
          type: string
          enum: [coins_5, coins_15, coins_30]
        userId:
          type: [string, "null"]
          format: uuid
        payload:
          type: object
          additionalProperties: true
    AdminModerationRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: [string, "null"]
    MessageResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    IdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
paths:
  /api/auth/registration:
    post:
      tags: [Auth]
      operationId: registerWithPassword
      x-auth: public
      security: []
      summary: Create a password account and return a session or email-confirmation state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegistrationRequest"
      responses:
        "200":
          description: Registration completed, or email confirmation is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        default:
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      x-auth: public
      security: []
      summary: Establish a password session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Authenticated session and mapped profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/whoami:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      x-auth: public
      security: []
      summary: Resolve the presented session token, or return an empty auth response.
      responses:
        "200":
          description: Current session response; empty when no valid session is presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        default:
          $ref: "#/components/responses/InternalServerError"
  /api/auth/recovery:
    post:
      tags: [Auth]
      operationId: requestPasswordRecovery
      x-auth: public
      security: []
      summary: Start password recovery without revealing whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRecoveryRequest"
      responses:
        "200":
          description: Recovery request accepted for email delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-auth: public
      security: []
      summary: Revoke the presented session token; idempotent when absent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Logout request completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          $ref: "#/components/responses/BadGateway"
  /auth/callback:
    get:
      tags: [Auth]
      operationId: handleAuthCallback
      x-auth: public
      x-client-availability: web
      security: []
      summary: Exchange web OAuth callback code and redirect.
      responses:
        "302":
          description: Redirect to authenticated web route.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/mobile-callback:
    get:
      tags: [Auth]
      operationId: handleMobileAuthCallback
      x-auth: public
      security: []
      summary: Exchange mobile OAuth callback code and redirect to app deep link.
      responses:
        "302":
          description: Redirect to React Native deep link.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      x-auth: user
      summary: Read current profile.
      responses:
        "200":
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      operationId: updateProfile
      x-auth: user
      summary: Update current profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile.
          content:
